name: Deploy on Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'release' && github.repository == 'onesiphorus-team/onesiforo-web'
    name: Deploy to Production
    runs-on: [self-hosted, production]
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Validate release reference
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Deploy release
        shell: bash
        run: |
          set -euo pipefail
          sudo -u www-data /var/www/onesiforo-web/deploy.sh "$RELEASE_TAG"

      - name: Verify deployed revision and services
        shell: bash
        run: |
          set -euo pipefail
          cd /var/www/onesiforo-web/current
          deployed_sha=$(sudo -u www-data git rev-parse HEAD)
          tag_sha=$(sudo -u www-data git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$deployed_sha" == "$RELEASE_SHA" && "$tag_sha" == "$RELEASE_SHA" ]]
          systemctl is-active --quiet php8.4-fpm.service
          systemctl is-active --quiet onesiforo-web-worker.service
          systemctl is-active --quiet onesiforo-web-scheduler.timer
          sudo -u www-data php artisan deployment:verify-queue --timeout=60 --no-interaction

      - name: Verify HTTP readiness and release identity
        shell: bash
        run: |
          set -euo pipefail
          health_response=$(mktemp)
          trap 'rm -f "$health_response"' EXIT
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 5 --retry-delay 3 --retry-all-errors \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "https://onesiforo.a80.it/deployment-health?revision=$RELEASE_SHA" \
            --output "$health_response"
          php -r '
            $health = json_decode(file_get_contents($argv[1]), true, flags: JSON_THROW_ON_ERROR);
            if (($health["status"] ?? null) !== "ok"
                || ! in_array(getenv("RELEASE_TAG"), $health["tags"] ?? [], true)
                || ($health["revision"] ?? null) !== getenv("RELEASE_SHA")) {
                fwrite(STDERR, "HTTP release identity or readiness check failed.\n");
                exit(1);
            }
          ' "$health_response"

      - name: Notify success
        run: printf 'Verified production release %s (%s)\n' "$RELEASE_TAG" "$RELEASE_SHA"

  diagnose-verification:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'onesiphorus-team/onesiforo-web'
    name: Inspect verification permissions
    runs-on: [self-hosted, production]
    timeout-minutes: 2
    steps:
      - name: Inspect non-secret access prerequisites
        shell: bash
        run: |
          set -euo pipefail
          id
          sudo -n -l || true
          cd /var/www/onesiforo-web/current
          git -c safe.directory="$(pwd -P)" rev-parse HEAD
          for path in .env bootstrap/cache/config.php vendor/autoload.php; do
            if test -r "$path"; then
              printf 'Readable: %s\n' "$path"
            else
              printf 'Not readable: %s\n' "$path"
            fi
          done
          for path in storage/logs storage/framework/cache storage/framework/views; do
            if test -w "$path"; then
              printf 'Writable: %s\n' "$path"
            else
              printf 'Not writable: %s\n' "$path"
            fi
          done
          systemctl is-active php8.4-fpm.service onesiforo-web-worker.service onesiforo-web-scheduler.timer
