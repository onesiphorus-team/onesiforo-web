name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    if: github.repository == 'onesiphorus-team/onesiforo-web'
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Testing

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Audit Node Dependencies
        run: npm audit

      - name: Test Vite Configuration
        run: node --test tests/vite.config.test.js

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Add Flux Credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Composer Dependencies
        uses: ramsey/composer-install@v4

      - name: Audit Composer Dependencies
        run: composer audit --abandoned=report

      - name: Copy Environment File
        run: cp .env.ci .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Build Assets
        run: npm run build

      - name: Cache Blade Icons
        run: php artisan icons:cache

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: ./vendor/bin/pest --parallel

  concurrency:
    if: github.repository == 'onesiphorus-team/onesiforo-web'
    name: MariaDB concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Testing
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-concurrency-ci
          MARIADB_DATABASE: onesiforo_concurrency_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Copy Testing Environment
        run: cp .env.ci .env
      - name: Add Flux Credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - name: Install Composer Dependencies
        uses: ramsey/composer-install@v4
      - name: Generate Application Key
        run: php artisan key:generate --no-interaction
      - name: Run Contended Database Tests
        env:
          CONCURRENCY_TESTS: '1'
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: onesiforo_concurrency_testing
          DB_USERNAME: root
          DB_PASSWORD: isolated-concurrency-ci
        run: vendor/bin/pest --configuration phpunit.concurrency.xml --compact
